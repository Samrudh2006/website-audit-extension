<!doctype html><html><head><meta charset="utf-8"><title>sticky bad</title>
<style>
  body{font-family:Georgia,serif;background:#fff;color:#111;margin:0}
  header.site{position:sticky;top:0;height:64px;background:#fffdf9;border-bottom:1px solid #e8dfd2;display:flex;align-items:center;padding:0 16px;z-index:10}
  section{min-height:70vh;padding:16px}
  a:focus-visible{outline:2px solid #1a56db}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<header class="site"><a href="/">Acme</a></header>
<main>
  <section id="one"><h2>One</h2><a href="#two">Go two</a></section>
  <section id="two"><h2>Two</h2><a href="#three">Go three</a></section>
  <section id="three"><h2>Three</h2><a href="#one">Back to one</a></section>
</main>
</body></html>
