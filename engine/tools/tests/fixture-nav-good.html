<!doctype html><html><head><meta charset="utf-8"><title>nav good</title>
<style>
  body{font-family:Georgia,serif;background:#fff;color:#111;margin:0}
  header.site{position:sticky;top:0;background:#fffdf9;border-bottom:1px solid #e8dfd2;display:flex;gap:16px;padding:12px;align-items:center}
  .drop{position:relative}
  .drop-panel{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid #ccc;min-width:180px}
  .drop.open .drop-panel{display:block}
  #drawer{display:none;position:fixed;inset:0 30% 0 0;background:#fff;border-right:1px solid #ccc;padding:16px;z-index:20}
  #drawer.open{display:block}
  #scrim{display:none;position:fixed;inset:0;background:#0006;z-index:15}
  #scrim.on{display:block}
  a:focus-visible,button:focus-visible{outline:2px solid #1a56db}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<header class="site">
  <a class="logo" href="/">Acme</a>
  <nav aria-label="Main">
    <a href="/about">About</a>
    <span class="drop">
      <button id="dropBtn" aria-expanded="false" aria-controls="dropPanel" type="button">Services</button>
      <span class="drop-panel" id="dropPanel">
        <a href="/a">Alpha</a><a href="/b">Beta</a>
      </span>
    </span>
  </nav>
  <button id="burger" aria-expanded="false" aria-controls="drawer" type="button">Menu</button>
</header>
<div id="scrim"></div>
<div id="drawer" role="dialog" aria-modal="true" aria-label="Site menu">
  <button id="drawerClose" type="button">Close</button>
  <a href="/m1">Drawer link one</a><a href="/m2">Drawer link two</a>
</div>
<main><h1>Page</h1><a href="/content">Content link</a></main>
<script>
const drop = document.querySelector('.drop'), dropBtn = document.getElementById('dropBtn');
let lastFocus = null;
function closeDrop(){ drop.classList.remove('open'); dropBtn.setAttribute('aria-expanded','false'); }
dropBtn.addEventListener('click', () => {
  const open = drop.classList.toggle('open');
  dropBtn.setAttribute('aria-expanded', String(open));
  if (open) drop.querySelector('.drop-panel a').focus();
});
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim'), burger = document.getElementById('burger');
function openDrawer(){ lastFocus = document.activeElement; drawer.classList.add('open'); scrim.classList.add('on'); burger.setAttribute('aria-expanded','true'); [...document.body.children].forEach((el) => { if (el !== drawer) el.inert = true; }); document.getElementById('drawerClose').focus(); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('on'); [...document.body.children].forEach((el) => { el.inert = false; }); burger.setAttribute('aria-expanded','false'); if (lastFocus) lastFocus.focus(); }
burger.addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (drawer.classList.contains('open')) { closeDrawer(); return; }
    if (drop.classList.contains('open')) { closeDrop(); dropBtn.focus(); }
  }
});
</script>
</body></html>
